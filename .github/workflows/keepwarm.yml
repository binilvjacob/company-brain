name: keepwarm
# Render's free tier sleeps after idle; a reviewer clicking the link should
# never stare at a cold start. Ping every 10 minutes during plausible review
# hours (UTC). Costs nothing; delete after the hiring process.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ping healthz
        run: |
          if [ -f deploy/render_url.txt ]; then
            url=$(cat deploy/render_url.txt)
            curl -sf --max-time 60 "$url/healthz" || echo "ping failed (service may be redeploying)"
          else
            echo "no deploy/render_url.txt yet"
          fi
