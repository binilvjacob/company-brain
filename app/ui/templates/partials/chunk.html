{% if c %}
<div class="text-xs uppercase tracking-wide text-slate-400 mb-1">source</div>
<div class="font-semibold">{{ c.title }}</div>
{% if c.heading %}<div class="text-sm text-slate-500">› {{ c.heading }}</div>{% endif %}
<div class="text-xs text-slate-500 mt-1 mb-2">
  {{ c.doc_type }} · team {{ c.team }} · owner @{{ c.owner }} · updated {{ c.doc_updated.strftime('%Y-%m-%d') }}
</div>
<pre class="whitespace-pre-wrap text-[13px] leading-relaxed text-slate-800 bg-slate-50 border border-slate-100 rounded p-2 max-h-96 overflow-y-auto">{{ c.text }}</pre>
<a href="/sources/{{ c.doc_id }}" class="inline-block mt-2 text-xs text-sky-700 underline">open full document →</a>
{% else %}
<div class="text-sm text-slate-500">Chunk not found.</div>
{% endif %}
