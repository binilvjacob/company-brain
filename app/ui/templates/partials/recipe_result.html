<div class="bg-white border border-slate-200 rounded-lg p-4">
  {% if r.answered %}
    <div class="md leading-relaxed" data-raw="{{ r.answer_markdown | e }}"></div>
    <div class="mt-3 flex flex-wrap gap-1.5">
      {% for c in r.citations %}
      <button data-cite-n="{{ c.n }}" data-chunk="{{ c.chunk_id }}"
              hx-get="/ui/chunk/{{ c.chunk_id }}" hx-target="#sourcepane" hx-swap="innerHTML"
              class="text-xs border border-slate-300 rounded-full px-2 py-0.5 hover:bg-sky-50"
              title="{{ c.doc_type }} · updated {{ c.updated_at }}">
        [{{ c.n }}] {{ c.title | truncate(42) }}
      </button>
      {% endfor %}
    </div>
    <div class="mt-2 text-[11px] text-slate-400">confidence {{ r.confidence }} · {{ r.latency_ms }} ms</div>

    {% if recipe.slug == 'triage-assist' %}
    <details class="mt-4 border-t border-slate-100 pt-3">
      <summary class="cursor-pointer text-sm font-semibold text-emerald-700">✓ Resolve &amp; Teach the Brain</summary>
      <form hx-post="/ui/capture" hx-target="#result" hx-swap="innerHTML" class="mt-3 space-y-2 text-sm">
        <div class="grid grid-cols-2 gap-2">
          <input name="payer" value="{{ inputs.payer or '' }}" placeholder="Payer" required class="border border-slate-300 rounded px-2 py-1.5">
          <input name="procedure" value="{{ inputs.procedure or '' }}" placeholder="Procedure (CDT)" required class="border border-slate-300 rounded px-2 py-1.5">
        </div>
        <input name="flag_reason" value="{{ inputs.flag_reason or '' }}" placeholder="Flag reason" required class="w-full border border-slate-300 rounded px-2 py-1.5">
        <input name="decision" placeholder="Your decision (e.g. verified eligible — D4910 covered 4x/12mo post-SRP)" required class="w-full border border-slate-300 rounded px-2 py-1.5">
        <textarea name="reasoning" rows="3" placeholder="Your reasoning — this is what the next specialist (and eventually the agents) will read" required class="w-full border border-slate-300 rounded px-2 py-1.5"></textarea>
        <div class="flex gap-2">
          <input name="author" placeholder="Your name" required class="border border-slate-300 rounded px-2 py-1.5">
          <input name="case_ref" placeholder="Case ref (optional)" class="border border-slate-300 rounded px-2 py-1.5">
          <button class="bg-emerald-700 hover:bg-emerald-800 text-white rounded px-3 py-1.5 font-medium">Teach the Brain</button>
        </div>
      </form>
    </details>
    {% endif %}
  {% else %}
    <div class="text-slate-800"><span class="font-semibold text-rose-700">I don't know.</span> {{ r.message or r.reason }}</div>
  {% endif %}
</div>
